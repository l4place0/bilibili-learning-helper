[project]
name = "bilibili-learning-helper"
version = "0.1.0"
description = "CLI primitives for capturing video transcripts and key frames into a local learning library"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "yt-dlp>=2024.0",
    "python-dotenv>=1.0",
    "httpx>=0.27.0",
    "click>=8.0",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
openai = [
    "openai>=1.0",
]
dev = [
    "openai>=1.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]
standalone = [
    "imageio-ffmpeg==0.6.0",
    "openai>=1.0",
    "pyinstaller>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["unit: Unit tests", "integration: Integration tests"]

[project.scripts]
video-sum = "cli:main"
